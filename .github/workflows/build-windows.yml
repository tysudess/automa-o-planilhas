name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências
        run: npm install

      - name: Gerar Windows Portable
        run: npm run dist

      - name: Criar Release v1.1.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          target_commitish: main
          name: Automacao Planilhas Windows Portable v1.1.0
          body: |
            Versao com proxy corporativo configuravel dentro do programa.

            - Proxy integrado ao Chrome/WhatsApp Web
            - Proxy integrado ao envio para o Apps Script
            - Proxy habilitado por padrao: proxy-7dn.mb:6060
            - Campo de ativacao, servidor e porta na tela de Configuracoes
            - Mantem selecao automatica da aba mensal pela data da materia
            - Mantem Chrome oculto em segundo plano
            - Mantem layout, grupos, videos e regras de classificacao
          files: dist/AutomacaoPlanilhas-Windows-Portable-v1.1.0.exe
          make_latest: true
