name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências
        run: npm install

      - name: Gerar Windows Portable
        run: npm run dist

      - name: Criar Release v1.0.1
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          target_commitish: main
          name: Automação Planilhas Windows Portable v1.0.1
          body: |
            Correção do Windows Portable.

            - Corrige erro "Cannot find module qrcode-terminal" ao clicar em INICIAR
            - Empacota o motor junto com as dependências do aplicativo
            - Mantém interface, grupos, Apps Script, notícias, vídeos e classificações da v1.0.0
          files: dist/AutomacaoPlanilhas-Windows-Portable-v1.0.1.exe
          make_latest: true
