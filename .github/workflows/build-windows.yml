name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências
        run: npm install

      - name: Gerar Windows Portable
        run: npm run dist

      - name: Criar Release v1.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          target_commitish: main
          name: Automação Planilhas Windows Portable v1.0.0
          body: |
            Primeira versão Windows Portable da automação WhatsApp → Google Planilhas.

            - Interface gráfica
            - Iniciar/Parar motor
            - Status do WhatsApp e da planilha
            - Log em tempo real
            - Configuração dos grupos e Apps Script
            - Suporte a notícias e vídeos
            - Classificação automática de análise e assunto
          files: dist/AutomacaoPlanilhas-Windows-Portable-v1.0.0.exe
          make_latest: true
