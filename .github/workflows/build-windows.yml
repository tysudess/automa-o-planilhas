name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências
        run: npm install

      - name: Gerar Windows Portable
        run: npm run dist

      - name: Criar Release v1.0.2
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          target_commitish: main
          name: Automação Planilhas Windows Portable v1.0.2
          body: |
            Nova versão visual da Automação Planilhas.

            - Chrome/WhatsApp Web executando oculto em segundo plano
            - Novo layout escuro inspirado no painel aprovado
            - Painel com status do WhatsApp, planilha e motor
            - Lista dos grupos monitorados
            - Resumo de mensagens e vídeos processados
            - Área da última notícia processada
            - Navegação lateral para Painel, Configurações, Log e Sobre
            - Novo ícone do aplicativo
            - Mantém notícias, vídeos, Apps Script e regras de classificação já aprovadas
          files: dist/AutomacaoPlanilhas-Windows-Portable-v1.0.2.exe
          make_latest: true
