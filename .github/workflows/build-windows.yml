name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências
        run: npm install

      - name: Gerar Windows Portable
        run: npm run dist

      - name: Criar Release v1.0.4
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4
          target_commitish: main
          name: Automacao Planilhas Windows Portable v1.0.4
          body: |
            Versao com novo icone do aplicativo.

            - Novo icone mais limpo e legivel no Windows
            - Mantem selecao automatica da aba mensal pela data da materia
            - Mantem Chrome oculto em segundo plano
            - Mantem layout, grupos, videos e regras de classificacao
          files: dist/AutomacaoPlanilhas-Windows-Portable-v1.0.4.exe
          make_latest: true
