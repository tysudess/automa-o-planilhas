name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependências
        run: npm install
      - name: Validar JavaScript
        shell: pwsh
        run: |
          node --check main.js
          node --check preload.js
          node --check renderer/renderer.js
          node --check engine/index.js
      - name: Gerar Windows Portable
        run: npm run dist
      - name: Criar Release v1.1.2
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.2
          target_commitish: main
          name: Automacao Planilhas Windows Portable v1.1.2
          body: |
            Versao com correcao de autenticacao do proxy e estabilidade.

            - Proxy integrado ao Chrome/WhatsApp Web e Apps Script
            - Servidor padrao proxy-7dn.mb:6060
            - Usuario e senha do proxy configuraveis dentro do programa
            - Autenticacao do proxy aplicada diretamente ao whatsapp-web.js
            - Botao TESTAR PROXY na tela de configuracoes
            - Indicador de status do proxy no painel
            - Mensagens duplicadas persistidas em arquivo local somente apos sucesso
            - Reconexao automatica do WhatsApp Web
            - Recuperacao automatica do motor apos encerramento inesperado
            - Contador de erros e ultima linha registrada
            - Selecao automatica da aba mensal pela data
            - Chrome oculto em segundo plano
          files: dist/AutomacaoPlanilhas-Windows-Portable-v1.1.2.exe
          make_latest: true
