name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: automacao-planilhas-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependências
        run: npm install

      - name: Validar JavaScript
        shell: pwsh
        run: |
          node --check main.js
          node --check preload.js
          node --check renderer/renderer.js
          node --check engine/index.js

      - name: Gerar Windows Portable
        run: npm run dist

      - name: Conferir executável
        shell: pwsh
        run: |
          $file = "dist/AutomacaoPlanilhas-Windows-Portable-v1.1.2.exe"
          if (!(Test-Path $file)) { throw "Executável não encontrado: $file" }
          $size = (Get-Item $file).Length
          Write-Host "Executável gerado: $file"
          Write-Host "Tamanho: $size bytes"

      - name: Publicar Release v1.1.2
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"
          $tag = "v1.1.2"
          $file = "dist/AutomacaoPlanilhas-Windows-Portable-v1.1.2.exe"
          $existing = gh release view $tag --repo $repo 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag já existe. Nenhuma nova publicação será criada."
            exit 0
          }
          gh release create $tag $file --repo $repo --title "Automacao Planilhas Windows Portable v1.1.2" --notes "Correção da autenticação do proxy e melhorias de estabilidade.`n`n- Proxy configurável: proxy-7dn.mb:6060`n- Usuário e senha de proxy na interface`n- Teste do proxy na interface`n- Autenticação do proxy no WhatsApp Web`n- Reconexão automática`n- Recuperação do motor`n- Deduplicação persistente`n- Status detalhado e contador de erros`n- Aba mensal automática pela data" --latest
