name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Validar JavaScript
        shell: pwsh
        run: |
          node --check main.js
          node --check preload.js
          node --check renderer/renderer.js
          node --check engine/index.js

      - name: Gerar Windows Portable
        shell: pwsh
        run: npm run dist

      - name: Conferir executável
        shell: pwsh
        run: |
          $file = "dist/AutomacaoPlanilhas-Windows-Portable-v1.1.2.exe"
          if (!(Test-Path $file)) {
            Write-Host "Arquivos encontrados em dist:"
            Get-ChildItem dist -ErrorAction SilentlyContinue | Select-Object Name,Length
            throw "Executável não encontrado: $file"
          }
          $size = (Get-Item $file).Length
          if ($size -lt 10000000) { throw "Executável com tamanho inesperado: $size bytes" }
          Write-Host "Executável gerado: $file ($size bytes)"

      - name: Publicar Release v1.1.2
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"
          $tag = "v1.1.2"
          $file = "dist/AutomacaoPlanilhas-Windows-Portable-v1.1.2.exe"
          $exists = gh release view $tag --repo $repo 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag já existe. Atualizando o arquivo."
            gh release upload $tag $file --repo $repo --clobber
            if ($LASTEXITCODE -ne 0) { throw "Falha ao atualizar o asset da Release $tag" }
            exit 0
          }
          gh release create $tag $file --repo $repo --title "Automacao Planilhas Windows Portable v1.1.2" --notes "Correção da autenticação do proxy e melhorias de estabilidade.`n`n- Proxy configurável: proxy-7dn.mb:6060`n- Usuário e senha na interface`n- TESTAR PROXY`n- Autenticação do proxy no WhatsApp Web`n- Reconexão automática`n- Recuperação automática do motor`n- Deduplicação persistente`n- Status detalhado e contador de erros`n- Aba mensal automática pela data"
          if ($LASTEXITCODE -ne 0) { throw "Falha ao criar a Release $tag" }
