name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências
        run: npm install

      - name: Gerar Windows Portable
        run: npm run dist

      - name: Criar Release v1.0.3
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          target_commitish: main
          name: Automacao Planilhas Windows Portable v1.0.3
          body: |
            Versao com selecao automatica da aba mensal pela data da materia.
            Mantem o Chrome oculto, o layout atual e as regras de classificacao.
          files: dist/AutomacaoPlanilhas-Windows-Portable-v1.0.3.exe
          make_latest: true
