<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Automação Planilhas</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><h1>WhatsApp → Planilha</h1><p>Automação Windows Portable</p></div><span class="version">v1.0.0</span></header>
<main><section class="cards"><article><span>Motor</span><strong id="statusMotor">PARADO</strong></article><article><span>WhatsApp</span><strong id="statusWhats">DESCONHECIDO</strong></article><article><span>Planilha</span><strong id="statusSheet">AGUARDANDO</strong></article><article><span>Processadas</span><strong id="count">0</strong></article></section>
<section class="actions"><button id="start" class="primary">INICIAR</button><button id="stop">PARAR</button><button id="openCfg">ABRIR CONFIGURAÇÃO</button></section>
<section class="panel"><div class="panel-title"><h2>Configurações</h2><span>Salve com o motor parado</span></div><label>Apps Script URL<input id="appsUrl" type="text"></label><div class="row"><label>Aba da planilha<input id="aba" type="text"></label><label>Caminho do Chrome (opcional)<input id="chrome" type="text" placeholder="Deixe vazio para detectar automaticamente"></label></div><label>IDs dos grupos (um por linha)<textarea id="grupos" rows="4"></textarea></label><label class="check"><input id="diag" type="checkbox"> Ativar diagnóstico de grupos</label><button id="saveCfg">SALVAR CONFIGURAÇÕES</button></section>
<section class="panel log-panel"><div class="panel-title"><h2>Log do sistema</h2><button id="clearLog" class="small">LIMPAR</button></div><pre id="log">Pronto para iniciar.</pre></section></main><script src="renderer.js"></script></body></html>
